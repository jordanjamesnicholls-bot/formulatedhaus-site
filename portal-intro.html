<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formulated Haus — Portal Intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bone:#F5EFE3; --ink:#26231F; --ink-2:#3a352e; --cobalt:#2540D0; --cobalt-dk:#1B2F9E;
    --gray:#8A8377; --line:rgba(38,35,31,.12);
    --font:'Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--ink);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
  .scene{position:fixed;inset:0;display:grid;place-items:center}
  .mark{display:block}
  .part{transform-box:fill-box;transform-origin:center}
  .p-glow,.p-ring{transform-box:fill-box;transform-origin:center}

  /* ---------- keyframes ---------- */
  @keyframes veilup{0%{opacity:1}100%{opacity:0}}
  @keyframes seedpulse{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}
    28%{opacity:.95;transform:translate(-50%,-50%) scale(1.15)}
    60%{opacity:.45;transform:translate(-50%,-50%) scale(.8)}
    100%{opacity:0;transform:translate(-50%,-50%) scale(.5)}}
  @keyframes drop{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:none}}
  @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  @keyframes growx{from{opacity:0;transform:scaleX(.1)}to{opacity:1;transform:none}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
  @keyframes glowbreath{0%{opacity:.38;transform:scale(.8)}70%{opacity:0;transform:scale(1.9)}100%{opacity:0;transform:scale(1.9)}}
  /* accelerating charge — bursts get closer + brighter, then a held bright swell */
  @keyframes chargeGlow{
    0%{opacity:0;transform:scale(.7)}
    16%{opacity:.5;transform:scale(1.5)} 24%{opacity:0;transform:scale(1.75)}
    42%{opacity:.62;transform:scale(1.55)} 49%{opacity:0;transform:scale(1.8)}
    64%{opacity:.75;transform:scale(1.6)} 70%{opacity:0;transform:scale(1.85)}
    82%{opacity:.9;transform:scale(1.65)} 87%{opacity:0;transform:scale(1.9)}
    95%{opacity:1;transform:scale(1.35)} 100%{opacity:1;transform:scale(1.2)}}
  @keyframes diveout{0%{transform:scale(1.05);filter:blur(0);opacity:1}
    100%{transform:scale(2.9);filter:blur(9px);opacity:0}}
  @keyframes irisin{0%{clip-path:circle(0% at 50% 50%);transform:scale(1.2);filter:blur(11px)}
    100%{clip-path:circle(150% at 50% 50%);transform:scale(1);filter:blur(0)}}
  @keyframes streakout{0%{opacity:0;transform:scale(.3) rotate(0deg)}
    30%{opacity:.9}100%{opacity:0;transform:scale(2.7) rotate(9deg)}}
  @keyframes flashpk{0%{opacity:0}42%{opacity:.9}100%{opacity:0}}
  @keyframes rimout{0%{opacity:.9;transform:translate(-50%,-50%) scale(.05)}
    100%{opacity:0;transform:translate(-50%,-50%) scale(5.5)}}

  /* ---------- STAGE (house + portal) ---------- */
  #stage{background:var(--bone);z-index:30}
  #stage::before{content:"";position:absolute;inset:0;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:60px 60px;opacity:.45;
    -webkit-mask-image:radial-gradient(ellipse 58% 55% at 50% 50%,#000 22%,transparent 70%);
            mask-image:radial-gradient(ellipse 58% 55% at 50% 50%,#000 22%,transparent 70%)}
  #stage .mark{width:212px;height:212px;position:relative;transition:transform .9s cubic-bezier(.3,.6,.2,1),filter .9s ease}
  #stage .part{opacity:0}
  #stage .p-glow{opacity:0}
  #stage .p-ring{stroke-dasharray:113.1;stroke-dashoffset:113.1}

  /* build — crafted, staggered, slight overshoot easing */
  #cinema.play #stage .p-roof{animation:drop .8s cubic-bezier(.25,.9,.3,1) .35s both}
  #cinema.play #stage .p-plb {animation:rise .7s cubic-bezier(.25,.9,.3,1) .75s both}
  #cinema.play #stage .p-prb {animation:rise .7s cubic-bezier(.25,.9,.3,1) 1.05s both}
  #cinema.play #stage .p-plt {animation:rise .65s cubic-bezier(.25,.9,.3,1) 1.4s both}
  #cinema.play #stage .p-prt {animation:rise .65s cubic-bezier(.25,.9,.3,1) 1.7s both}
  #cinema.play #stage .p-bar {animation:growx .7s cubic-bezier(.25,.9,.3,1) 2.05s both}
  #cinema.play #stage .p-ring{animation:draw 1.05s cubic-bezier(.3,.6,.2,1) 2.5s both}
  #cinema.built #stage .p-ring{stroke-dashoffset:0}   /* lock drawn */

  /* charge — mark gathers + glow accelerates */
  #cinema.charging #stage .mark{transform:scale(1.05);filter:brightness(1.03)}
  #cinema.charging #stage .p-glow{animation:chargeGlow 1.5s cubic-bezier(.4,0,.7,1) both}
  /* dive — rush forward through the portal */
  #cinema.diving #stage .mark{transform:none}
  #cinema.diving #stage{animation:diveout .85s cubic-bezier(.55,0,.9,.25) both}

  /* ---------- overlays ---------- */
  .seed{position:fixed;top:50%;left:50%;width:30px;height:30px;border-radius:50%;transform:translate(-50%,-50%) scale(.3);
    background:radial-gradient(circle,var(--cobalt),rgba(37,64,208,0) 70%);z-index:31;opacity:0;pointer-events:none}
  #cinema.play .seed{animation:seedpulse 1.5s ease both}

  .streaks{position:fixed;inset:-25%;z-index:33;pointer-events:none;opacity:0;transform:scale(.3);
    background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(37,64,208,0) 0deg,rgba(37,64,208,.30) .35deg,rgba(37,64,208,0) 1.5deg)}
  #cinema.diving .streaks{animation:streakout 1.05s ease-out both}

  .flash{position:fixed;inset:0;z-index:34;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 50%,#eef2ff 0%,var(--cobalt) 42%,rgba(37,64,208,0) 75%)}
  #cinema.diving .flash{animation:flashpk .8s ease both .18s}

  .rim{position:fixed;top:50%;left:50%;width:130px;height:130px;border-radius:50%;border:10px solid var(--cobalt);
    z-index:34;opacity:0;transform:translate(-50%,-50%) scale(.05);pointer-events:none;box-shadow:0 0 46px rgba(37,64,208,.6)}
  #cinema.diving .rim{animation:rimout 1s cubic-bezier(.5,0,.3,1) both .1s}

  .veil{position:fixed;inset:0;background:var(--ink);z-index:45;pointer-events:none}
  #cinema.play .veil{animation:veilup .95s ease both}

  /* ---------- SITE (arrival) ---------- */
  #site{z-index:10;background:var(--bone);clip-path:circle(0% at 50% 50%);place-items:stretch}
  #cinema.diving #site{animation:irisin 1.35s cubic-bezier(.4,0,.12,1) both}
  .site-nav{position:absolute;top:0;left:0;right:0;height:70px;display:flex;align-items:center;justify-content:space-between;
    padding:0 clamp(20px,5vw,48px);opacity:0}
  #cinema.diving .site-nav{animation:fadeup .8s ease .75s both}
  .site-nav .brand{display:flex;align-items:center;gap:10px}
  .site-nav .brand .mark{width:28px}
  .site-nav .brand b{font-weight:700;letter-spacing:.16em;font-size:13px}
  .site-nav .lk{display:flex;gap:26px;align-items:center;font-size:14px;font-weight:500;color:var(--ink-2)}
  .site-nav .btn{background:var(--cobalt);color:#fff;font-weight:600;font-size:13px;padding:10px 18px;border-radius:8px}
  @media(max-width:720px){.site-nav .lk a:not(.btn){display:none}}
  .site-hero{position:relative;height:100%;display:grid;place-items:center;text-align:center;overflow:hidden}
  .site-hero::before{content:"";position:absolute;inset:0;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:60px 60px;opacity:.45;
    -webkit-mask-image:radial-gradient(ellipse 62% 60% at 50% 48%,#000 22%,transparent 72%);
            mask-image:radial-gradient(ellipse 62% 60% at 50% 48%,#000 22%,transparent 72%)}
  .hero-mark{position:absolute;width:min(620px,92vw);z-index:1}
  .hero-mark .part{opacity:.05}
  .hero-mark .p-ring{opacity:.16}
  #cinema.diving .hero-mark .p-ring{animation:breath 2.9s ease-in-out 1.3s infinite}
  #cinema.diving .hero-mark .p-glow{animation:glowbreath 2.9s ease-out 1.3s infinite}
  .hero-copy{position:relative;z-index:2;max-width:820px;padding:0 24px}
  .hero-copy .eyebrow{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--cobalt);font-weight:600;opacity:0}
  .hero-copy h1{font-size:clamp(34px,6vw,64px);line-height:1.04;letter-spacing:-.02em;font-weight:800;margin-top:16px;opacity:0}
  .hero-copy h1 em{font-style:normal;color:var(--cobalt)}
  .hero-copy p{font-size:clamp(15px,2vw,19px);color:var(--ink-2);margin-top:20px;opacity:0}
  .hero-copy .cta{margin-top:30px;opacity:0}
  .hero-copy .btn{display:inline-block;background:var(--cobalt);color:#fff;font-weight:600;font-size:15px;padding:13px 24px;border-radius:9px}
  #cinema.diving .eyebrow{animation:fadeup .8s ease .95s both}
  #cinema.diving h1{animation:fadeup .9s ease 1.1s both}
  #cinema.diving .hero-copy p{animation:fadeup .9s ease 1.35s both}
  #cinema.diving .hero-copy .cta{animation:fadeup .9s ease 1.55s both}

  .rot{display:inline-block}
  .rot .rw{display:inline-block;transition:opacity .36s ease, transform .36s ease}
  .ctl{position:fixed;bottom:18px;right:18px;z-index:60;display:flex;gap:8px}
  .ctl button{font-family:var(--font);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gray);
    background:rgba(245,239,227,.8);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;backdrop-filter:blur(6px)}
  .ctl button:hover{border-color:var(--cobalt);color:var(--cobalt)}

  @media(prefers-reduced-motion:reduce){
    #stage,.rim,.flash,.streaks,.seed,.veil{display:none}
    #site{clip-path:none}
    .site-nav,.eyebrow,h1,.hero-copy p,.hero-copy .cta{opacity:1 !important;animation:none !important}
    .hero-mark .p-ring{animation:breath 2.9s ease-in-out infinite}
  }
</style>
</head>
<body>
<div id="cinema">
  <!-- SITE (revealed through the portal) -->
  <div class="scene" id="site">
    <nav class="site-nav">
      <div class="brand"><span data-mark></span><b>FORMULATED HAUS</b></div>
      <div class="lk"><a>Work</a><a>Process</a><a class="btn">Start a project</a></div>
    </nav>
    <div class="site-hero">
      <span class="hero-mark" data-mark></span>
      <div class="hero-copy">
        <span class="eyebrow">For&nbsp;<span class="rot"><span class="rw" id="rwPortal">restaurants</span></span></span>
        <h1>Design for your customers. <em>Systems for your team.</em></h1>
        <p>We design the site your customers see — and engineer the system your team runs on.</p>
        <div class="cta"><a class="btn">Start a project</a></div>
      </div>
    </div>
  </div>

  <!-- STAGE (house builds, portal charges) -->
  <div class="scene" id="stage"><span class="mark" data-mark></span></div>

  <!-- overlays -->
  <div class="seed"></div>
  <div class="streaks"></div>
  <div class="flash"></div>
  <div class="rim"></div>
  <div class="veil"></div>
</div>

<div class="ctl"><button onclick="skip()">Skip</button><button onclick="replay()">↻ Replay</button></div>

<script>
function markSVG(){
  return `<svg class="mark" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" aria-label="Formulated Haus">
    <circle class="p-glow" cx="120" cy="140" r="18" fill="none" stroke="#2540D0" stroke-width="8"/>
    <polygon class="p-roof part" points="120,48 188,88 52,88" fill="#26231F"/>
    <rect class="p-plt part" x="60"  y="95"  width="35" height="15" fill="#26231F"/>
    <rect class="p-plb part" x="60"  y="113" width="35" height="72" fill="#26231F"/>
    <rect class="p-prt part" x="145" y="95"  width="35" height="15" fill="#26231F"/>
    <rect class="p-prb part" x="145" y="113" width="35" height="72" fill="#26231F"/>
    <rect class="p-bar part" x="95"  y="130" width="50" height="20" fill="#26231F"/>
    <circle class="p-ring" cx="120" cy="140" r="18" fill="none" stroke="#2540D0" stroke-width="8"/>
  </svg>`;
}
document.querySelectorAll('[data-mark]').forEach(el=>el.innerHTML=markSVG());

const cinema=document.getElementById('cinema');
let timers=[];
const at=(ms,fn)=>timers.push(setTimeout(fn,ms));
const clr=()=>{timers.forEach(clearTimeout);timers=[];};

function run(){
  clr();
  cinema.className='';
  void cinema.offsetWidth;
  cinema.classList.add('play');           // veil lifts · seed blooms · house builds (~0.35–3.55s)
  at(3550,()=>cinema.classList.add('built'));   // lock the drawn portal
  at(4150,()=>cinema.classList.add('charging')); // held beat, then accelerating charge
  at(5650,()=>{ cinema.classList.remove('charging'); cinema.classList.add('diving'); }); // punch through + arrive
}
function skip(){ clr(); cinema.className='built diving'; }
function replay(){ run(); }
window.addEventListener('load',run); run();

// cycling verticals in the hero eyebrow
(function(){
  const words=['restaurants','spas','studios','gyms','salons','trades','retail','your team'];
  const el=document.getElementById('rwPortal');
  if(!el) return;
  let i=0;
  setInterval(function(){
    el.style.opacity='0'; el.style.transform='translateY(-8px)';
    setTimeout(function(){
      el.style.transition='none';
      i=(i+1)%words.length; el.textContent=words[i];
      el.style.transform='translateY(8px)'; void el.offsetWidth;
      el.style.transition=''; el.style.opacity='1'; el.style.transform='translateY(0)';
    },380);
  },2400);
})();
</script>
</body>
</html>
